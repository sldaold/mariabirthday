<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Открытка с поздравлением</title>
    <link rel = "stylesheet" href="./src/style.css">
</head>
<body>
    <div class="modal">
        <div class="popup">
            <img src="./src/cake2.png" class="gift-img">
            <h1 class="modal-h1">Точно хочешь забрать?</h1>
            <a class="modal-button" href="./src/gift/С ДНЕМ РОЖДЕНИЯ.pdf">ДА</a>
        </div>
    </div>
    <div class ="start">
        <div class="block">
            <div class="border">
            <div class="block-before">
            <div class="block-name">
            <div class="block-name-razdel">
            <h1 class="name">С ДНЁМ РОЖДЕНИЯ,<p class="maria">Маша!</p></h1>
            <h2 class='text'>Пусть каждый день будет как праздник — ярким, волшебным и полным моментов, которые хочется запомнить навсегда.</h2>
            <button class="gift" id="gift" onclick="showModal()">Забрать подарок</button>
          </div>
          
         </div>
        </div>
        <div class="block-after">
            <div class="age-bage">
                <h1 class="age">16</h1>
                <span class="age-label">лет</span>
            </div>
            <img src="./src/cake.png" class="cake">
        </div>
        </div>
        </div>
    </div>
    <svg class="sparkle sparkle-one" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 1c1.2 9.8 5.2 13.8 15 15-9.8 1.2-13.8 5.2-15 15C14.8 21.2 10.8 17.2 1 16 10.8 14.8 14.8 10.8 16 1Z"></path></svg>
    <svg class="sparkle sparkle-two" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 1c1.2 9.8 5.2 13.8 15 15-9.8 1.2-13.8 5.2-15 15C14.8 21.2 10.8 17.2 1 16 10.8 14.8 14.8 10.8 16 1Z"></path></svg>
    <script src='./src/script.js'></script>
</body>
</html>
